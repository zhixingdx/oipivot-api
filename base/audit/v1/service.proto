syntax = "proto3";

package oipivot.audit.v1;

option go_package = "github.com/zhixingdx/oipivot-api/base/audit/v1;auditv1";

import "base/audit/v1/message.proto";

// AuditService serves backend producers inside one project. Trusted internal RPC
// carries the resource tenant in metadata. Deployments may bind producers to
// workload certificates with mTLS. Platform and tenant frontends use HTTP.
service AuditService {
  rpc AppendRecords(AppendRecordsRequest) returns (AppendRecordsResponse);
  rpc ConfirmSoftDelete(ConfirmSoftDeleteRequest) returns (ConfirmSoftDeleteResponse);
  rpc GetPayload(GetPayloadRequest) returns (GetPayloadResponse);
}
